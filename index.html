<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>籃球射籃分析 (半身) - 水平虛線版</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 { margin: 0; font-size: 20px; color: #38bdf8; }
    .controls-top { display: flex; gap: 8px; align-items: center; }
    select, button {
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    select { background: #1e293b; color: white; border: 1px solid #475569; }
    .btn-record { background: #ef4444; color: white; font-size: 16px; padding: 10px 22px; }
    .btn-record:disabled { background: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: white; }
    .btn-tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; flex: 1; }
    .btn-tab.active { background: #0284c7; color: white; border-color: #38bdf8; }

    .main-layout {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 960px;
      flex-wrap: wrap;
    }
    .video-panel {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #stage-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; display: block; }

    #overlay-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border-left: 5px solid #38bdf8;
    }
    #rec-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ef4444;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .side-panel {
      flex: 1;
      min-width: 260px;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tab-group { display: flex; gap: 8px; }
    .metric-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border-left: 5px solid #64748b;
    }
    .metric-title { font-size: 13px; color: #94a3b8; }
    .metric-value { font-size: 22px; font-weight: bold; margin: 4px 0; }
    .metric-hint { font-size: 13px; color: #cbd5e1; line-height: 1.4; }

    .scrubber-box {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .action-bar { display: flex; justify-content: center; gap: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🏀 籃球射籃分析 (半身)</h1>
    <div class="controls-top">
      <label for="hand-select" style="font-size:14px; color:#94a3b8;">慣用手：</label>
      <select id="hand-select">
        <option value="right">右手</option>
        <option value="left">左手</option>
      </select>
    </div>
  </header>

  <div class="main-layout">
    <div class="video-panel">
      <div id="stage-container">
        <video id="input_video" playsinline autoplay muted></video>
        <canvas id="output_canvas"></canvas>
        <div id="overlay-badge">正在載入 AI 模型...</div>
        <div id="rec-indicator">● 錄影中 4.0s</div>
      </div>

      <div id="scrubber-box" class="scrubber-box">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#94a3b8;">
          <span>手動微調影格 (如 AI 捉錯格可左右拉動)</span>
          <span id="frame-counter">第 0 / 0 格</span>
        </div>
        <input type="range" id="frame-slider" min="0" max="0" value="0">
      </div>

      <div class="action-bar">
        <button id="btn-record" class="btn-record">● 開始錄影 (4秒)</button>
        <button id="btn-reset" class="btn-secondary" style="display:none;">🔄 重新拍攝</button>
      </div>
    </div>

    <div class="side-panel">
      <div id="result-tabs" class="tab-group" style="display:none;">
        <button id="tab-set" class="btn-tab active">1. 準備舉球</button>
        <button id="tab-release" class="btn-tab">2. 出手投射</button>
      </div>

      <div id="feedback-area">
        <div style="color:#94a3b8; font-size:14px; line-height:1.6;">
          <p><strong>操作步驟：</strong></p>
          <p>1. 請企喺射籃者<strong>正側面 90°</strong>（距離約 1.5–2 米，拍腰部以上）。</p>
          <p>2. 撳紅色<strong>「開始錄影」</strong>，喺 4 秒內完成一次射籃動作。</p>
          <p>3. 系統會自動捉出「準備」同「出手」兩張定格相並評分！</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const overlayBadge = document.getElementById('overlay-badge');
    const recIndicator = document.getElementById('rec-indicator');
    const btnRecord = document.getElementById('btn-record');
    const btnReset = document.getElementById('btn-reset');
    const handSelect = document.getElementById('hand-select');
    const scrubberBox = document.getElementById('scrubber-box');
    const frameSlider = document.getElementById('frame-slider');
    const frameCounter = document.getElementById('frame-counter');
    const resultTabs = document.getElementById('result-tabs');
    const tabSet = document.getElementById('tab-set');
    const tabRelease = document.getElementById('tab-release');
    const feedbackArea = document.getElementById('feedback-area');

    let mode = 'live';
    let recordedFrames = [];
    let recordStartTime = 0;
    const RECORD_DURATION = 4000;

    let setPointIndex = 0;
    let releasePointIndex = 0;
    let currentTab = 'set';

    const snapCanvas = document.createElement('canvas');
    const snapCtx = snapCanvas.getContext('2d');

    function calcAngle(a, b, c, w, h) {
      const ax = a.x * w, ay = a.y * h;
      const bx = b.x * w, by = b.y * h;
      const cx = c.x * w, cy = c.y * h;
      const rad = Math.atan2(cy - by, cx - bx) - Math.atan2(ay - by, ax - bx);
      let deg = Math.abs(rad * 180.0 / Math.PI);
      if (deg > 180.0) deg = 360 - deg;
      return Math.round(deg);
    }

    function calcUpperArmAngle(shoulder, elbow, w, h) {
      const verticalDown = { x: shoulder.x, y: shoulder.y + 0.3 };
      return calcAngle(verticalDown, shoulder, elbow, w, h);
    }

    function calcReleaseAngle(shoulder, wrist, w, h) {
      const dy = (shoulder.y - wrist.y) * h;
      const dx = Math.abs(wrist.x - shoulder.x) * w;
      return Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
    }

    function getArmLandmarks(lm) {
      const isRight = handSelect.value === 'right';
      return {
        shoulder: lm[isRight ? 12 : 11],
        elbow: lm[isRight ? 14 : 13],
        wrist: lm[isRight ? 16 : 15]
      };
    }

    function drawArmOverlay(ctx, w, h, arm, angleText, color, extra = null) {
      const sx = arm.shoulder.x * w, sy = arm.shoulder.y * h;
      const ex = arm.elbow.x * w, ey = arm.elbow.y * h;
      const wx = arm.wrist.x * w, wy = arm.wrist.y * h;

      // 垂直參考虛線（穿過膊頭）
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(sx, sy - 80);
      ctx.lineTo(sx, sy + 140);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 新增：喺「出手投射」模式畫橫向水平虛線 + 仰角弧線
      if (extra && extra.showHorizontal) {
        const dir = (wx >= sx) ? 1 : -1;
        const lineLen = 170;

        // 橫向水平虛線
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + dir * lineLen, sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 仰角弧線
        const wristAngle = Math.atan2(wy - sy, wx - sx);
        ctx.setLineDash([]);
        ctx.beginPath();
        if (dir === 1) {
          ctx.arc(sx, sy, 58, 0, wristAngle, true);
        } else {
          ctx.arc(sx, sy, 58, Math.PI, wristAngle, false);
        }
        ctx.strokeStyle = extra.relColor;
        ctx.lineWidth = 4;
        ctx.stroke();

        // 仰角度數標籤
        ctx.font = 'bold 22px Arial';
        ctx.fillStyle = extra.relColor;
        const labelX = dir === 1 ? sx + 68 : sx - 155;
        ctx.fillText(`仰角 ${extra.releaseAngle}°`, labelX, sy - 14);
      }
      ctx.restore();

      // 手臂線條
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.lineTo(wx, wy);
      ctx.lineWidth = 7;
      ctx.strokeStyle = color;
      ctx.stroke();

      // 關節點
      [[sx, sy], [ex, ey], [wx, wy]].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = color;
        ctx.stroke();
      });

      // 手肘角度標籤
      ctx.font = 'bold 26px Arial';
      ctx.fillStyle = color;
      ctx.fillText(angleText, ex + 16, ey);
    }

    function onResults(results) {
      if (mode === 'review') return;

      const w = videoElement.videoWidth || 640;
      const h = videoElement.videoHeight || 480;
      canvasElement.width = w;
      canvasElement.height = h;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      let currentArm = null;
      let elbowAngle = null;

      if (results.poseLandmarks) {
        const arm = getArmLandmarks(results.poseLandmarks);
        if (arm.shoulder.visibility > 0.4 && arm.elbow.visibility > 0.4 && arm.wrist.visibility > 0.4) {
          currentArm = arm;
          elbowAngle = calcAngle(arm.shoulder, arm.elbow, arm.wrist, w, h);
          const color = (elbowAngle >= 80 && elbowAngle <= 100) ? '#22c55e' : '#38bdf8';
          drawArmOverlay(canvasCtx, w, h, arm, `${elbowAngle}°`, color);
          overlayBadge.innerText = `即時偵測｜手肘夾角：${elbowAngle}°`;
        } else {
          overlayBadge.innerText = '請企入側面鏡頭範圍（確保手臂清晰）';
        }
      }

      if (mode === 'recording') {
        const elapsed = Date.now() - recordStartTime;
        const remain = Math.max(0, (RECORD_DURATION - elapsed) / 1000).toFixed(1);
        recIndicator.innerText = `● 錄影中 ${remain}s`;

        if (currentArm) {
          snapCanvas.width = w;
          snapCanvas.height = h;
          snapCtx.drawImage(results.image, 0, 0, w, h);
          recordedFrames.push({
            imgData: snapCanvas.toDataURL('image/jpeg', 0.7),
            arm: JSON.parse(JSON.stringify(currentArm)),
            elbowAngle: elbowAngle,
            upperArmAngle: calcUpperArmAngle(currentArm.shoulder, currentArm.elbow, w, h),
            releaseAngle: calcReleaseAngle(currentArm.shoulder, currentArm.wrist, w, h),
            wristY: currentArm.wrist.y
          });
        }

        if (elapsed >= RECORD_DURATION) {
          finishRecording();
        }
      }
      canvasCtx.restore();
    }

    function finishRecording() {
      mode = 'review';
      recIndicator.style.display = 'none';
      btnRecord.style.display = 'none';
      btnReset.style.display = 'inline-block';

      if (recordedFrames.length < 5) {
        overlayBadge.innerText = '偵測唔到足夠手臂畫面，請重新拍攝！';
        return;
      }

      let minWristY = 999;
      releasePointIndex = 0;
      recordedFrames.forEach((f, idx) => {
        if (f.wristY < minWristY) {
          minWristY = f.wristY;
          releasePointIndex = idx;
        }
      });

      let minElbow = 999;
      setPointIndex = 0;
      const searchLimit = Math.max(1, releasePointIndex);
      for (let i = 0; i < searchLimit; i++) {
        if (recordedFrames[i].elbowAngle < minElbow) {
          minElbow = recordedFrames[i].elbowAngle;
          setPointIndex = i;
        }
      }

      frameSlider.max = recordedFrames.length - 1;
      scrubberBox.style.display = 'flex';
      resultTabs.style.display = 'flex';

      showTab('set');
    }

    function showTab(tabName) {
      currentTab = tabName;
      tabSet.classList.toggle('active', tabName === 'set');
      tabRelease.classList.toggle('active', tabName === 'release');
      const idx = tabName === 'set' ? setPointIndex : releasePointIndex;
      frameSlider.value = idx;
      renderReviewFrame(idx);
    }

    function renderReviewFrame(idx) {
      const frame = recordedFrames[idx];
      if (!frame) return;
      frameCounter.innerText = `第 ${idx + 1} / ${recordedFrames.length} 格`;

      const img = new Image();
      img.onload = () => {
        canvasElement.width = img.width;
        canvasElement.height = img.height;
        canvasCtx.clearRect(0, 0, img.width, img.height);
        canvasCtx.drawImage(img, 0, 0);

        if (currentTab === 'set') {
          const okElbow = frame.elbowAngle >= 80 && frame.elbowAngle <= 100;
          const okUpper = frame.upperArmAngle >= 60 && frame.upperArmAngle <= 95;
          drawArmOverlay(canvasCtx, img.width, img.height, frame.arm, `${frame.elbowAngle}°`, okElbow ? '#22c55e' : '#ef4444');
          overlayBadge.innerText = `定格 1：準備舉球 (Set Point)`;

          feedbackArea.innerHTML = `
            <div class="metric-card" style="border-left-color:${okElbow ? '#22c55e' : '#ef4444'}">
              <div class="metric-title">手肘夾角 (理想：80°–100°)</div>
              <div class="metric-value" style="color:${okElbow ? '#22c55e' : '#ef4444'}">${frame.elbowAngle}° ${okElbow ? '✅ 達標' : '⚠️ 需微調'}</div>
              <div class="metric-hint">${frame.elbowAngle < 80 ? '手肘收得太死，個波太貼面。' : frame.elbowAngle > 100 ? '手臂太開，發力容易散。' : '準備角度非常標準！'}</div>
            </div>
            <div class="metric-card" style="border-left-color:${okUpper ? '#22c55e' : '#f59e0b'}">
              <div class="metric-title">大臂抬升角 (理想：60°–95°)</div>
              <div class="metric-value" style="color:${okUpper ? '#22c55e' : '#f59e0b'}">${frame.upperArmAngle}° ${okUpper ? '✅ 達標' : '⚠️ 需微調'}</div>
              <div class="metric-hint">${frame.upperArmAngle < 60 ? '舉波太低，似喺胸口推波。' : frame.upperArmAngle > 95 ? '手肘抬得過高，發力唔順。' : '舉球高度適中！'}</div>
            </div>
          `;
        } else {
          const okExt = frame.elbowAngle >= 160;
          const okRel = frame.releaseAngle >= 45 && frame.releaseAngle <= 65;
          const relColor = okRel ? '#22c55e' : '#f59e0b';
          drawArmOverlay(
            canvasCtx, img.width, img.height, frame.arm,
            `${frame.elbowAngle}°`,
            okExt ? '#22c55e' : '#ef4444',
            { showHorizontal: true, releaseAngle: frame.releaseAngle, relColor: relColor }
          );
          overlayBadge.innerText = `定格 2：出手投射 (Release)`;

          feedbackArea.innerHTML = `
            <div class="metric-card" style="border-left-color:${okExt ? '#22c55e' : '#ef4444'}">
              <div class="metric-title">手臂伸展度 (理想：160°–180°)</div>
              <div class="metric-value" style="color:${okExt ? '#22c55e' : '#ef4444'}">${frame.elbowAngle}° ${okExt ? '✅ 達標' : '⚠️ 未伸直'}</div>
              <div class="metric-hint">${okExt ? '手臂完全伸直，發力充分！' : '出手有少少縮手，記得推盡隻手。'}</div>
            </div>
            <div class="metric-card" style="border-left-color:${relColor}">
              <div class="metric-title">出手仰角 (理想：45°–65°)</div>
              <div class="metric-value" style="color:${relColor}">${frame.releaseAngle}° ${okRel ? '✅ 達標' : '⚠️ 需微調'}</div>
              <div class="metric-hint">${frame.releaseAngle < 45 ? '出手太低太平，容易炒粉。' : frame.releaseAngle > 65 ? '抬得太高，拋物線過高唔夠力。' : '拋物線仰角非常理想！'}</div>
            </div>
          `;
        }
      };
      img.src = frame.imgData;
    }

    btnRecord.addEventListener('click', () => {
      recordedFrames = [];
      recordStartTime = Date.now();
      mode = 'recording';
      recIndicator.style.display = 'block';
      btnRecord.disabled = true;
    });

    btnReset.addEventListener('click', () => {
      mode = 'live';
      btnRecord.style.display = 'inline-block';
      btnRecord.disabled = false;
      btnReset.style.display = 'none';
      scrubberBox.style.display = 'none';
      resultTabs.style.display = 'none';
      feedbackArea.innerHTML = '<div style="color:#94a3b8; font-size:14px;">已返回即時鏡頭，準備好可隨時再錄影。</div>';
    });

    tabSet.addEventListener('click', () => showTab('set'));
    tabRelease.addEventListener('click', () => showTab('release'));
    frameSlider.addEventListener('input', (e) => {
      const idx = parseInt(e.target.value, 10);
      if (currentTab === 'set') setPointIndex = idx;
      else releasePointIndex = idx;
      renderReviewFrame(idx);
    });

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({ image: videoElement }); },
      width: 640, height: 480, facingMode: 'environment'
    });
    camera.start();
  </script>
</body>
</html>
